name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (win-x64, autonome)
        shell: pwsh
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: dotnet publish src/BibiTv/BibiTv.csproj -c Release -r win-x64 --self-contained true -o publish/BibiTv "-p:TmdbKey=$env:TMDB_KEY"

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/BibiTv/* -DestinationPath publish/BibiTv-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BibiTv-win-x64
          path: publish/BibiTv/

      - name: Lire la version
        id: version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content src/BibiTv/BibiTv.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "tag=v$v" >> $env:GITHUB_OUTPUT

      # Publie (ou met à jour) la release correspondant à la <Version> du .csproj
      - name: Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          name: BibiTV ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: publish/BibiTv-win-x64.zip
          body: |
            Téléchargez **BibiTv-win-x64.zip**, extrayez-le puis lancez `BibiTv.exe`.
            Aucune installation nécessaire (.NET et VLC sont inclus).

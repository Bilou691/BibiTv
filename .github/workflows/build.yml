# Ancienne app Windows (WPF / C#), remplacée par l'app desktop (dossier desktop/, workflow desktop.yml).
# Compilation manuelle uniquement, sans publication : les PC Windows reçoivent désormais l'app desktop.
name: Build Windows (ancienne app WPF)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (win-x64, autonome)
        shell: pwsh
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY || secrets.TMDB8KEY }}
        run: dotnet publish src/BibiTv/BibiTv.csproj -c Release -r win-x64 --self-contained true -o publish/BibiTv "-p:TmdbKey=$env:TMDB_KEY"

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/BibiTv/* -DestinationPath publish/BibiTv-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BibiTv-win-x64
          path: publish/BibiTv/
